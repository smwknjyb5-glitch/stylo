<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>القلم يتتبّع المسار</title>
  <meta property="og:image" content="https://smwknjyb5-glitch.github.io/stylo/stylo.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="صورة تطبيق  القلم">
<style>
:root{--bg:#f6f3ea;--card:#fff;--ink:#23303f;--accent:#2a6fdb;--line:#d9d2bd;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#171c24;--card:#212835;--ink:#e8edf5;--accent:#6aa3ff;--line:#3a4558}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Segoe UI",Tahoma,Arial,sans-serif}
.wrap{max-width:900px;margin:0 auto;padding:14px}
h1{font-size:1.3rem;margin:6px 0 4px;text-align:center}
p.hint{margin:0 0 10px;text-align:center;font-size:.95rem;opacity:.8}
.bar{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;align-items:center;margin-bottom:10px}
button{font:inherit;padding:8px 14px;border:0;border-radius:10px;background:var(--accent);color:#fff;cursor:pointer}
button.alt{background:var(--card);color:var(--ink);border:1px solid var(--line)}
button:disabled{opacity:.45;cursor:default}
label{display:flex;align-items:center;gap:6px;font-size:.9rem}
input[type=color]{width:38px;height:34px;padding:0;border:1px solid var(--line);border-radius:8px;background:var(--card);cursor:pointer}
#stage{background:var(--card);border:2px solid var(--line);border-radius:14px;width:100%;height:min(62vh,520px);touch-action:none;display:block;cursor:crosshair}
#info{text-align:center;font-size:.85rem;opacity:.7;margin-top:6px}
</style>
</head>
<body>
<div class="wrap">
  <h1>✏️ القلم يتتبّع المسار</h1>
  <p class="hint">ارسم بالفأرة أو بإصبعك. ارفع الفأرة ثم انتقل إلى مكان آخر وأكمل الرسم (مقاطع متعددة)، ثم اضغط «ابدأ».</p>
  <div class="bar">
    <label>لون الخط <input type="color" id="color" value="#2a6fdb"></label>
    <label>السُّمك <input type="range" id="width" min="2" max="14" value="4"></label>
    <button id="undo" class="alt" disabled>↶ تراجع عن المقطع</button>
    <button id="clear" class="alt">🗑 مسح</button>
  </div>
  <div class="bar">
    <button id="go" disabled>▶ ابدأ</button>
    <button id="replay" class="alt" disabled>↻ إعادة</button>
    <button id="vid" class="alt" disabled>🎥 حفظ كفيديو</button>
    <button id="dlbtn" style="display:none">⬇ تنزيل الفيديو</button>
    <label>السرعة <input type="range" id="speed" min="1" max="10" value="4"></label>
  </div>
  <canvas id="stage"></canvas>
  <div id="info"></div>
</div>
<script>
const cv=document.getElementById('stage'),ctx=cv.getContext('2d');
const $=id=>document.getElementById(id);
const go=$('go'),replay=$('replay'),vid=$('vid'),dlbtn=$('dlbtn'),clear=$('clear'),undo=$('undo'),speed=$('speed'),colorIn=$('color'),widthIn=$('width'),info=$('info');
let strokes=[],cur=null,drawing=false,anim=null,progress=0,recording=false,onEnd=null,pending=null;
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim()}
function resize(){
  const r=cv.getBoundingClientRect(),d=window.devicePixelRatio||1;
  cv.width=r.width*d;cv.height=r.height*d;ctx.setTransform(d,0,0,d,0,0);render(anim||progress===1?progress:null);
}
window.addEventListener('resize',resize);
function pos(e){const r=cv.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}}
function updateUI(){
  const ok=strokes.some(s=>s.pts.length>2);
  go.disabled=!ok||!!anim;replay.disabled=true;vid.disabled=!ok||!!anim||recording;undo.disabled=!strokes.length||!!anim;
  info.textContent=strokes.length?('عدد المقاطع: '+strokes.length):'';
}
cv.addEventListener('pointerdown',e=>{
  dlbtn.style.display='none';stop();progress=0;cur={pts:[pos(e)],color:colorIn.value,w:+widthIn.value};strokes.push(cur);
  drawing=true;cv.setPointerCapture(e.pointerId);render(null);
});
cv.addEventListener('pointermove',e=>{
  if(!drawing)return;const p=pos(e),l=cur.pts[cur.pts.length-1];
  if(Math.hypot(p.x-l.x,p.y-l.y)>2){cur.pts.push(p);render(null)}
});
function end(){
  if(!drawing)return;drawing=false;
  if(cur.pts.length<3)strokes.pop();
  cur=null;updateUI();render(null);
}
cv.addEventListener('pointerup',end);cv.addEventListener('pointercancel',end);

function flatten(){
  const f=[];
  strokes.forEach(s=>s.pts.forEach((p,i)=>f.push({x:p.x,y:p.y,c:s.color,w:s.w,pen:i>0})));
  return f;
}
function drawPen(x,y){
  ctx.save();ctx.translate(x,y);
  ctx.fillStyle='#f4b400';ctx.strokeStyle='#5a4300';ctx.lineWidth=1.2;
  ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(7,-16);ctx.lineTo(-1,-18);ctx.closePath();ctx.fill();ctx.stroke();
  ctx.fillStyle=colorIn.value;
  ctx.beginPath();ctx.moveTo(-1,-18);ctx.lineTo(7,-16);ctx.lineTo(19,-52);ctx.lineTo(11,-55);ctx.closePath();ctx.fill();ctx.stroke();
  ctx.fillStyle='#23303f';ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(2.6,-6);ctx.lineTo(-0.5,-6.5);ctx.closePath();ctx.fill();
  ctx.restore();
}
function line(a,b,c,w){ctx.strokeStyle=c;ctx.lineWidth=w;ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke()}
function render(t){
  const W=cv.clientWidth,H=cv.clientHeight;ctx.clearRect(0,0,W,H);ctx.fillStyle=css('--card');ctx.fillRect(0,0,W,H);
  ctx.lineCap=ctx.lineJoin='round';
  if(t===null){
    strokes.forEach(s=>{
      ctx.strokeStyle=s.color;ctx.lineWidth=s.w;ctx.beginPath();
      s.pts.forEach((p,i)=>i?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y));
      if(s.pts.length===1){ctx.lineTo(s.pts[0].x+.1,s.pts[0].y)}
      ctx.stroke();
    });
    return;
  }
  const f=flatten();if(f.length<2)return;
  // dotted guide
  ctx.setLineDash([2,8]);
  strokes.forEach(s=>{ctx.strokeStyle=css('--line');ctx.lineWidth=3;ctx.beginPath();
    s.pts.forEach((p,i)=>i?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y));ctx.stroke()});
  ctx.setLineDash([]);
  const L=[0];for(let i=1;i<f.length;i++)L.push(L[i-1]+Math.hypot(f[i].x-f[i-1].x,f[i].y-f[i-1].y));
  const total=L[L.length-1],d=t*total;
  let i=1;while(i<f.length-1&&L[i]<d)i++;
  const seg=L[i]-L[i-1]||1,fr=Math.min(1,Math.max(0,(d-L[i-1])/seg));
  const x=f[i-1].x+(f[i].x-f[i-1].x)*fr,y=f[i-1].y+(f[i].y-f[i-1].y)*fr;
  for(let k=1;k<i;k++)if(f[k].pen)line(f[k-1],f[k],f[k].c,f[k].w);
  if(f[i].pen)line(f[i-1],{x,y},f[i].c,f[i].w);
  strokes.forEach(s=>{ctx.fillStyle='#e8453c';ctx.beginPath();ctx.arc(s.pts[0].x,s.pts[0].y,4,0,7);ctx.fill()});
  drawPen(x,y);
}
function stop(){if(anim){cancelAnimationFrame(anim);anim=null}}
function play(){
  stop();const f=flatten();if(f.length<3)return;
  let total=0;for(let i=1;i<f.length;i++)total+=Math.hypot(f[i].x-f[i-1].x,f[i].y-f[i-1].y);
  progress=0;let last=performance.now();
  go.disabled=true;replay.disabled=true;undo.disabled=true;
  (function step(now){
    const dt=now-last;last=now;
    progress+=(speed.value*60*dt/1000)/total;
    if(progress>=1){progress=1;render(1);anim=null;updateUI();replay.disabled=false;if(onEnd){const fn=onEnd;onEnd=null;setTimeout(fn,800)}return}
    render(progress);anim=requestAnimationFrame(step);
  })(last);
}
go.onclick=play;replay.onclick=play;
undo.onclick=()=>{stop();strokes.pop();progress=0;render(null);updateUI()};
clear.onclick=()=>{stop();strokes=[];progress=0;render(null);updateUI()};
async function record(){
  if(!window.MediaRecorder||!cv.captureStream){info.textContent='المتصفح لا يدعم تسجيل الفيديو';return}
  const types=[['video/webm;codecs=vp9','webm'],['video/webm','webm'],['video/mp4','mp4']];
  const t=types.find(x=>MediaRecorder.isTypeSupported(x[0]));
  if(!t){info.textContent='المتصفح لا يدعم تسجيل الفيديو';return}
  const chunks=[],mr=new MediaRecorder(cv.captureStream(30),{mimeType:t[0],videoBitsPerSecond:4e6});
  mr.ondataavailable=e=>{if(e.data.size)chunks.push(e.data)};
  mr.onstop=()=>{
    recording=false;updateUI();replay.disabled=false;
    pending={blob:new Blob(chunks,{type:t[0].split(';')[0]}),ext:t[1]};
    dlbtn.style.display='';info.textContent='انتهى التسجيل، اضغط «تنزيل الفيديو»';
  };
  recording=true;vid.disabled=true;dlbtn.style.display='none';
  info.textContent='جارٍ تسجيل الفيديو…';
  mr.start();onEnd=()=>mr.stop();play();
}
vid.onclick=record;
dlbtn.onclick=async()=>{
  if(!pending)return;const name='qalam-masar.'+pending.ext;let d=null;
  try{d=await claude.use('downloads')}catch(e){}
  if(d){
    try{await d.save({filename:name,data:pending.blob});info.textContent='تم حفظ الفيديو'}
    catch(e){info.textContent=(e&&e.code==='declined')?'أُلغي الحفظ':'تعذّر الحفظ'}
  }else{
    const a=document.createElement('a');a.href=URL.createObjectURL(pending.blob);a.download=name;a.click();
  }
};
resize();updateUI();
</script>
</body>
</html>
